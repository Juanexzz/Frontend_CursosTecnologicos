<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-audit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-audit)"/>
  <!-- Audit checklist / clipboard -->
  <rect x="260" y="100" width="280" height="260" rx="14" fill="#27272a" stroke="#a1a1aa" stroke-width="3"/>
  <rect x="340" y="80" width="120" height="35" rx="8" fill="#52525b" stroke="#d4d4d8" stroke-width="2"/>
  <circle cx="400" cy="97" r="6" fill="#f43f5e"/>
  <!-- Check lines -->
  <!-- Line 1 Check -->
  <circle cx="300" cy="160" r="12" fill="#22c55e"/>
  <path d="M294 160 L298 164 L306 156" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="330" y="154" width="170" height="12" rx="4" fill="#e4e4e7"/>
  <!-- Line 2 Check -->
  <circle cx="300" cy="210" r="12" fill="#22c55e"/>
  <path d="M294 210 L298 214 L306 206" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="330" y="204" width="150" height="12" rx="4" fill="#e4e4e7"/>
  <!-- Line 3 Warning -->
  <circle cx="300" cy="260" r="12" fill="#eab308"/>
  <text x="300" y="265" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">!</text>
  <rect x="330" y="254" width="130" height="12" rx="4" fill="#e4e4e7"/>
  <!-- Line 4 Check -->
  <circle cx="300" cy="310" r="12" fill="#22c55e"/>
  <path d="M294 310 L298 314 L306 306" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="330" y="304" width="160" height="12" rx="4" fill="#e4e4e7"/>
</svg>
