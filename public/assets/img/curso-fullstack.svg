<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent-fs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-fs)"/>
  <!-- Code editor window illustration -->
  <rect x="180" y="80" width="440" height="290" rx="12" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <circle cx="210" cy="105" r="6" fill="#ef4444"/>
  <circle cx="228" cy="105" r="6" fill="#f59e0b"/>
  <circle cx="246" cy="105" r="6" fill="#10b981"/>
  <!-- Code lines -->
  <rect x="210" y="140" width="160" height="14" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="210" y="170" width="280" height="12" rx="4" fill="#a5b4fc" opacity="0.6"/>
  <rect x="240" y="195" width="220" height="12" rx="4" fill="#6ee7b7" opacity="0.7"/>
  <rect x="240" y="220" width="180" height="12" rx="4" fill="#f472b6" opacity="0.7"/>
  <rect x="210" y="250" width="100" height="12" rx="4" fill="#fbbf24" opacity="0.8"/>
  <rect x="210" y="280" width="260" height="12" rx="4" fill="#a5b4fc" opacity="0.5"/>
  <!-- Node / TS Floating Badges -->
  <g transform="translate(100, 160)">
    <circle cx="30" cy="30" r="34" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="37" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">NODE</text>
  </g>
  <g transform="translate(630, 220)">
    <circle cx="30" cy="30" r="34" fill="#3b82f6" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
    <text x="30" y="37" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">TS</text>
  </g>
</svg>
